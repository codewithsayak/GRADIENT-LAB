<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Lab — Free CSS Gradient Generator | Code With Sayak</title>
    <meta name="description" content="Create beautiful linear, radial, and conic CSS gradients. Customize colors, copy CSS, download wallpapers, and share your designs for free.">
    <meta name="theme-color" content="#0f1115">
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Gradient Lab — Premium CSS Gradient Generator">
    <meta property="og:description" content="Craft beautiful gradients. Create without limits. By Code With Sayak.">
    <meta property="og:type" content="website">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Navigation -->
    <header class="navbar">
        <div class="nav-brand">
            <div class="logo-icon"></div>
            <div class="brand-text">
                <h1>Gradient Lab</h1>
                <span class="attribution">by Code With Sayak</span>
            </div>
        </div>
        
        <nav class="nav-links">
            <button class="nav-btn active" data-tab="editor-tab">Editor</button>
            <button class="nav-btn" data-tab="presets-tab">Explore</button>
            <button class="nav-btn" data-tab="saved-tab">My Gradients</button>
            <button class="nav-btn" data-tab="tools-tab">Color Tools</button>
        </nav>

        <div class="nav-actions">
            <button id="btn-random" class="icon-btn" title="Generate Random Gradient">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            </button>
            <button id="btn-theme" class="icon-btn" title="Toggle Theme">
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <button id="btn-share" class="icon-btn" title="Share URL">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            </button>
            <button id="btn-download-modal" class="btn btn-primary">Download</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
        
        <!-- LEFT PANEL -->
        <aside class="panel-left">
            
            <!-- EDITOR TAB -->
            <div id="editor-tab" class="tab-content active">
                
                <section class="control-group">
                    <label>Gradient Type</label>
                    <div class="segmented-control" id="type-selector">
                        <button class="segment active" data-type="linear">Linear</button>
                        <button class="segment" data-type="radial">Radial</button>
                        <button class="segment" data-type="conic">Conic</button>
                    </div>
                </section>

                <section class="control-group">
                    <div class="flex-between">
                        <label>Color Stops</label>
                        <button id="btn-add-stop" class="btn-text">+ Add Stop</button>
                    </div>
                    <div id="color-stops-container" class="color-stops-list">
                        <!-- Populated by JS -->
                    </div>
                </section>

                <div class="divider"></div>

                <!-- Linear Controls -->
                <section id="controls-linear" class="control-group dynamic-control active">
                    <div class="flex-between">
                        <label>Angle</label>
                        <div class="input-with-unit">
                            <input type="number" id="linear-angle-num" min="0" max="360" value="135">
                            <span>°</span>
                        </div>
                    </div>
                    <input type="range" id="linear-angle-slider" min="0" max="360" value="135" class="slider">
                    
                    <div class="angle-presets">
                        <button class="btn-icon-small" data-angle="0" title="To Top">↑</button>
                        <button class="btn-icon-small" data-angle="90" title="To Right">→</button>
                        <button class="btn-icon-small" data-angle="180" title="To Bottom">↓</button>
                        <button class="btn-icon-small" data-angle="270" title="To Left">←</button>
                    </div>
                </section>

                <!-- Radial Controls -->
                <section id="controls-radial" class="control-group dynamic-control">
                    <label>Shape</label>
                    <select id="radial-shape" class="select-input">
                        <option value="circle">Circle</option>
                        <option value="ellipse">Ellipse</option>
                    </select>

                    <label class="mt-4">Center Position X & Y (%)</label>
                    <div class="flex-row">
                        <input type="range" id="radial-x" min="0" max="100" value="50" class="slider">
                        <input type="range" id="radial-y" min="0" max="100" value="50" class="slider">
                    </div>
                </section>

                <!-- Conic Controls -->
                <section id="controls-conic" class="control-group dynamic-control">
                    <div class="flex-between">
                        <label>Start Angle</label>
                        <div class="input-with-unit">
                            <input type="number" id="conic-angle-num" min="0" max="360" value="0">
                            <span>°</span>
                        </div>
                    </div>
                    <input type="range" id="conic-angle-slider" min="0" max="360" value="0" class="slider">

                    <label class="mt-4">Center Position X & Y (%)</label>
                    <div class="flex-row">
                        <input type="range" id="conic-x" min="0" max="100" value="50" class="slider">
                        <input type="range" id="conic-y" min="0" max="100" value="50" class="slider">
                    </div>
                </section>

            </div>

            <!-- PRESETS TAB -->
            <div id="presets-tab" class="tab-content">
                <div class="preset-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="popular">Popular</button>
                    <button class="filter-btn" data-filter="dark">Dark</button>
                    <button class="filter-btn" data-filter="neon">Neon</button>
                    <button class="filter-btn" data-filter="sunset">Sunset</button>
                </div>
                <div id="presets-grid" class="presets-grid">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- SAVED TAB -->
            <div id="saved-tab" class="tab-content">
                <div class="save-action-box">
                    <input type="text" id="save-gradient-name" placeholder="Name this gradient...">
                    <button id="btn-save-current" class="btn btn-primary">Save Current</button>
                </div>
                <div class="divider"></div>
                <div id="saved-list" class="saved-list">
                    <!-- Populated by JS -->
                    <div class="empty-state">No saved gradients yet.</div>
                </div>
            </div>

            <!-- TOOLS TAB -->
            <div id="tools-tab" class="tab-content">
                <div class="tool-section">
                    <h3>Color Converter</h3>
                    <input type="text" id="hex-converter-in" class="input-field" placeholder="#HEX" value="#6366f1">
                    <div class="converter-results">
                        <div class="flex-between"><span>RGB:</span> <code id="rgb-out">rgb(99, 102, 241)</code></div>
                        <div class="flex-between"><span>HSL:</span> <code id="hsl-out">hsl(239, 82%, 67%)</code></div>
                    </div>
                </div>
                <div class="divider"></div>
                <div class="tool-section">
                    <h3>Contrast Checker (WCAG)</h3>
                    <div class="flex-row mt-2">
                        <div>
                            <label>Text</label>
                            <input type="color" id="contrast-fg" value="#ffffff">
                        </div>
                        <div>
                            <label>Background</label>
                            <input type="color" id="contrast-bg" value="#6366f1">
                        </div>
                    </div>
                    <div class="contrast-result mt-4" id="contrast-box">
                        <h1 id="contrast-ratio">4.24:1</h1>
                        <p id="contrast-status">AA Large Text Pass</p>
                    </div>
                </div>
                <div class="divider"></div>
                <div class="tool-section">
                    <h3>Palette Extractor</h3>
                    <p class="text-muted text-sm">Upload an image to extract colors locally.</p>
                    <input type="file" id="palette-file" accept="image/*" class="mt-2">
                    <div id="extracted-palette" class="palette-grid mt-4"></div>
                </div>
            </div>

        </aside>

        <!-- RIGHT PANEL -->
        <section class="panel-right">
            <div class="preview-container checkerboard">
                <div id="live-preview" class="gradient-preview"></div>
                <div class="preview-controls">
                    <button id="btn-toggle-bg" class="btn-glass" title="Toggle Transparent Background">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    </button>
                    <button id="btn-fullscreen" class="btn-glass" title="Fullscreen Preview">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                    </button>
                </div>
            </div>

            <div class="code-container">
                <div class="code-header">
                    <select id="css-format" class="select-input select-small">
                        <option value="background">CSS Background</option>
                        <option value="class">CSS Class</option>
                        <option value="variable">CSS Variable</option>
                        <option value="inline">Inline HTML</option>
                    </select>
                    <button id="btn-copy-css" class="btn btn-outline">Copy Code</button>
                </div>
                <pre><code id="css-output" class="language-css"></code></pre>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <div id="modal-download" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Export Wallpaper</h2>
                <button class="btn-close-modal">×</button>
            </div>
            <div class="modal-body">
                <label>Dimensions</label>
                <select id="download-size" class="select-input mb-4">
                    <option value="1920x1080">1920 × 1080 (FHD)</option>
                    <option value="2560x1440">2560 × 1440 (QHD)</option>
                    <option value="1080x1920">1080 × 1920 (Mobile)</option>
                    <option value="1080x1080">1080 × 1080 (Square)</option>
                    <option value="custom">Custom Size</option>
                </select>
                
                <div id="custom-size-inputs" class="flex-row hidden mb-4">
                    <div>
                        <label>Width</label>
                        <input type="number" id="dl-width" value="1920" class="input-field">
                    </div>
                    <div>
                        <label>Height</label>
                        <input type="number" id="dl-height" value="1080" class="input-field">
                    </div>
                </div>

                <label>Format</label>
                <select id="download-format" class="select-input mb-4">
                    <option value="image/png">PNG (High Quality)</option>
                    <option value="image/jpeg">JPEG (Smaller File)</option>
                </select>
                
                <button id="btn-confirm-download" class="btn btn-primary w-full">Download Image</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">Copied to clipboard!</div>

    <!-- Hidden Canvas for Export -->
    <canvas id="export-canvas" class="hidden"></canvas>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
